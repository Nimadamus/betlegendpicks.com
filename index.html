<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetLegend Picks Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #d32f2f;
            font-size: 1.1em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status-posted {
            background: #4caf50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-graded {
            background: #2196f3;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .positive {
            color: #4caf50;
            font-weight: 600;
        }

        .negative {
            color: #f44336;
            font-weight: 600;
        }

        .sport-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            background: #e3f2fd;
            color: #1976d2;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }

            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 BetLegend Picks Tracker</h1>
            <p class="subtitle">Live Sports Betting Picks & Results</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('all')">All Picks</button>
            <button class="tab" onclick="switchTab('NFL')">NFL</button>
            <button class="tab" onclick="switchTab('NHL')">NHL</button>
            <button class="tab" onclick="switchTab('NBA')">NBA</button>
            <button class="tab" onclick="switchTab('MLB')">MLB</button>
            <button class="tab" onclick="switchTab('NCAAF')">NCAAF</button>
            <button class="tab" onclick="switchTab('NCAAB')">NCAAB</button>
            <button class="tab" onclick="switchTab('To Be Graded')">To Be Graded</button>
            <button class="tab" onclick="switchTab('records-all')">📊 All Records</button>
            <button class="tab" onclick="switchTab('records-nfl')">NFL Records</button>
            <button class="tab" onclick="switchTab('records-nhl')">NHL Records</button>
            <button class="tab" onclick="switchTab('records-nba')">NBA Records</button>
            <button class="tab" onclick="switchTab('records-mlb')">MLB Records</button>
            <button class="tab" onclick="switchTab('records-ncaaf')">NCAAF Records</button>
            <button class="tab" onclick="switchTab('records-ncaab')">NCAAB Records</button>
        </div>

        <div class="content">
            <div id="stats" class="stats-container"></div>
            <div id="picks-container">
                <div class="loading">Loading picks...</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadPicks()">🔄 Refresh</button>

    <script>
        const SHEET_ID = '1izhxwiiazn99SRqcK8QpUE4pfvDRIFpgSyw5ZlMsvmY';

        // Sheet GIDs (tab IDs) - these correspond to each sport sheet
        const SHEET_TABS = {
            'Sheet1': '0',
            'NFL': null,      // You'll need to get these GIDs from your sheet URLs
            'NHL': null,
            'NBA': null,
            'NCAAF': null,
            'NCAAB': null,
            'To Be Graded': null
        };

        let allData = [];
        let currentTab = 'all';

        async function loadPicks() {
            const container = document.getElementById('picks-container');
            container.innerHTML = '<div class="loading">Loading picks...</div>';

            try {
                const allSheetData = [];

                // Load from main sheet (Sheet1/gid=0) which should contain all picks
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
                const response = await fetch(csvUrl);

                if (!response.ok) {
                    throw new Error('Failed to fetch sheet. Make sure it is shared publicly.');
                }

                const csvText = await response.text();
                const lines = csvText.split('\n');

                // Skip header row
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim()) {
                        const values = parseCSVLine(lines[i]);
                        if (values[0] && values[0].trim()) { // Skip empty rows
                            allSheetData.push({
                                date: values[0] || '',           // A: Date
                                pick: values[1] || '',           // B: Pick
                                odds: values[2] || '',           // C: Odds
                                confidence: values[3] || '',     // D: Result (confidence)
                                units: values[4] || '',          // E: Units (calculated)
                                league: values[5] || '',         // F: League
                                sport: values[6] || '',          // G: Sport
                                status: values[7] || '',         // H: Ready (POSTED/DONE)
                                postedAt: values[8] || '',       // I: PostedAt
                                result: values[9] || '',         // J: Pushed and Graded
                                gradeUnit: values[10] || ''      // K: GRADE UNIT (W/L/P)
                            });
                        }
                    }
                }

                allData = allSheetData;
                displayPicks(currentTab);
                updateStats();

            } catch (error) {
                console.error('Error loading picks:', error);
                container.innerHTML = `
                    <div class="error">
                        <h2>Unable to load picks</h2>
                        <p>Please make sure the Google Sheet is shared as "Anyone with the link can view"</p>
                        <p style="margin-top: 20px;">
                            <strong>To fix this:</strong><br>
                            1. Open your Google Sheet<br>
                            2. Click "Share" in the top right<br>
                            3. Under "General access" click "Restricted"<br>
                            4. Change to "Anyone with the link"<br>
                            5. Make sure it's set to "Viewer"<br>
                            6. Click "Done"<br>
                            7. Refresh this page
                        </p>
                        <p style="margin-top: 15px; font-size: 0.9em;">
                            Error: ${error.message}
                        </p>
                    </div>
                `;
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());

            return result;
        }

        function switchTab(tab) {
            currentTab = tab;

            // Update active tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            displayPicks(tab);
        }

        function displayPicks(filter) {
            const container = document.getElementById('picks-container');

            // Check if this is a records view
            if (filter.startsWith('records-')) {
                displayRecords(filter);
                return;
            }

            let filteredData = allData;
            if (filter !== 'all') {
                if (filter === 'To Be Graded') {
                    filteredData = allData.filter(pick => pick.sheet === 'To Be Graded' || pick.status === 'POSTED');
                } else {
                    filteredData = allData.filter(pick => pick.sheet === filter || pick.league === filter || pick.sport === filter);
                }
            }

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="loading">No picks found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Pick</th>
                            <th>Units</th>
                            <th>Confidence</th>
                            <th>League</th>
                            <th>Sport</th>
                            <th>Status</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredData.forEach(pick => {
                const statusClass = pick.status === 'POSTED' ? 'status-posted' : 'status-graded';
                const unitsClass = parseFloat(pick.units) >= 0 ? 'positive' : 'negative';

                html += `
                    <tr>
                        <td>${pick.date}</td>
                        <td>${pick.pick}</td>
                        <td class="${unitsClass}">${pick.units}</td>
                        <td>${pick.confidence}</td>
                        <td><span class="sport-badge">${pick.league}</span></td>
                        <td>${pick.sport}</td>
                        <td><span class="${statusClass}">${pick.status}</span></td>
                        <td>${pick.result}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function displayRecords(filter) {
            const container = document.getElementById('picks-container');

            // Determine which sport to filter by
            let sportFilter = null;
            if (filter === 'records-nfl') sportFilter = 'NFL';
            else if (filter === 'records-nhl') sportFilter = 'NHL';
            else if (filter === 'records-nba') sportFilter = 'NBA';
            else if (filter === 'records-mlb') sportFilter = 'MLB';
            else if (filter === 'records-ncaaf') sportFilter = 'NCAAF';
            else if (filter === 'records-ncaab') sportFilter = 'NCAAB';

            // Filter data
            let filteredData = sportFilter
                ? allData.filter(pick => pick.sport === sportFilter || pick.league === sportFilter)
                : allData;

            // Calculate records
            const gradedPicks = filteredData.filter(p => p.gradeUnit && p.gradeUnit !== '');
            const wins = gradedPicks.filter(p => p.gradeUnit === 'W').length;
            const losses = gradedPicks.filter(p => p.gradeUnit === 'L').length;
            const pushes = gradedPicks.filter(p => p.gradeUnit === 'P').length;
            const totalUnits = gradedPicks.reduce((sum, p) => sum + (parseFloat(p.units) || 0), 0).toFixed(2);
            const winPct = gradedPicks.length > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) : '0.0';

            // Group by league if showing all records
            let recordsByLeague = {};
            if (!sportFilter) {
                const sports = ['NFL', 'NHL', 'NBA', 'MLB', 'NCAAF', 'NCAAB'];
                sports.forEach(sport => {
                    const sportPicks = allData.filter(p => p.sport === sport || p.league === sport);
                    const sportGraded = sportPicks.filter(p => p.gradeUnit && p.gradeUnit !== '');
                    if (sportGraded.length > 0) {
                        const sWins = sportGraded.filter(p => p.gradeUnit === 'W').length;
                        const sLosses = sportGraded.filter(p => p.gradeUnit === 'L').length;
                        const sPushes = sportGraded.filter(p => p.gradeUnit === 'P').length;
                        const sUnits = sportGraded.reduce((sum, p) => sum + (parseFloat(p.units) || 0), 0).toFixed(2);
                        const sWinPct = (sWins + sLosses) > 0 ? ((sWins / (sWins + sLosses)) * 100).toFixed(1) : '0.0';

                        recordsByLeague[sport] = {
                            wins: sWins,
                            losses: sLosses,
                            pushes: sPushes,
                            units: sUnits,
                            winPct: sWinPct
                        };
                    }
                });
            }

            let html = `
                <div class="stats-container" style="margin-bottom: 30px;">
                    <div class="stat-card">
                        <div class="stat-value">${wins}-${losses}${pushes > 0 ? '-' + pushes : ''}</div>
                        <div class="stat-label">Record (W-L${pushes > 0 ? '-P' : ''})</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${winPct}%</div>
                        <div class="stat-label">Win Percentage</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: ${totalUnits >= 0 ? '#4caf50' : '#f44336'}">${totalUnits >= 0 ? '+' : ''}${totalUnits}</div>
                        <div class="stat-label">Total Units</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${gradedPicks.length}</div>
                        <div class="stat-label">Graded Picks</div>
                    </div>
                </div>
            `;

            if (!sportFilter && Object.keys(recordsByLeague).length > 0) {
                html += `
                    <h3 style="margin-bottom: 15px; color: #333;">Records by Sport</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Sport</th>
                                <th>Record</th>
                                <th>Win %</th>
                                <th>Units</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                Object.keys(recordsByLeague).forEach(sport => {
                    const rec = recordsByLeague[sport];
                    const unitsClass = parseFloat(rec.units) >= 0 ? 'positive' : 'negative';
                    html += `
                        <tr>
                            <td><span class="sport-badge">${sport}</span></td>
                            <td>${rec.wins}-${rec.losses}${rec.pushes > 0 ? '-' + rec.pushes : ''}</td>
                            <td>${rec.winPct}%</td>
                            <td class="${unitsClass}">${rec.units >= 0 ? '+' : ''}${rec.units}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
            }

            // Show detailed picks for this sport
            if (gradedPicks.length > 0) {
                html += `
                    <h3 style="margin: 30px 0 15px; color: #333;">Recent Graded Picks</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Pick</th>
                                <th>Odds</th>
                                <th>Units</th>
                                <th>Result</th>
                                <th>League</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                // Show most recent graded picks (last 20)
                const recentPicks = gradedPicks.slice(-20).reverse();
                recentPicks.forEach(pick => {
                    const unitsClass = parseFloat(pick.units) >= 0 ? 'positive' : 'negative';
                    const resultBadge = pick.gradeUnit === 'W' ? 'status-posted' :
                                       pick.gradeUnit === 'L' ? 'status-graded' : '';

                    html += `
                        <tr>
                            <td>${pick.date}</td>
                            <td>${pick.pick}</td>
                            <td>${pick.odds}</td>
                            <td class="${unitsClass}">${pick.units >= 0 ? '+' : ''}${pick.units}</td>
                            <td><span class="${resultBadge}">${pick.gradeUnit}</span></td>
                            <td><span class="sport-badge">${pick.league}</span></td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
            }

            container.innerHTML = html;
        }

        function updateStats() {
            const statsContainer = document.getElementById('stats');

            const totalPicks = allData.length;
            const gradedPicks = allData.filter(p => p.result && p.result !== 'POSTED').length;
            const wins = allData.filter(p => parseFloat(p.units) > 0).length;
            const losses = allData.filter(p => parseFloat(p.units) < 0).length;
            const totalUnits = allData.reduce((sum, p) => sum + (parseFloat(p.units) || 0), 0).toFixed(2);

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalPicks}</div>
                    <div class="stat-label">Total Picks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${wins}</div>
                    <div class="stat-label">Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${losses}</div>
                    <div class="stat-label">Losses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: ${totalUnits >= 0 ? '#4caf50' : '#f44336'}">${totalUnits >= 0 ? '+' : ''}${totalUnits}</div>
                    <div class="stat-label">Total Units</div>
                </div>
            `;
        }

        // Load picks when page loads
        loadPicks();

        // Auto-refresh every 60 seconds
        setInterval(loadPicks, 60000);
    </script>
</body>
</html>
